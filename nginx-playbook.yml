---
- name: Install and configure Nginx web servers
  hosts: webservers
  become: yes

  tasks:
    - name: Install Nginx
      dnf:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Create custom website
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Terraform Ansible Nginx Project</title>
          </head>
          <body>
              <h1>Welcome to DevOps Project!</h1>
              <h2>Terraform + Ansible + Nginx + AWS ALB</h2>
              <p>Successfully deployed using Ansible automation.</p>
          </body>
          </html>
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'
